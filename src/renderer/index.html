<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir — Audio Router</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div id="app">
    <!-- 1. Title Bar -->
    <header class="titlebar" id="titlebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <span class="brand-name">Noir</span>
        <span class="brand-subtitle">Patchbay</span>
      </div>
      
      <div class="titlebar-actions">
        <button class="window-btn" id="btn-settings" title="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
        <button class="window-btn" id="btn-minimize" title="Minimize">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="window-btn" id="btn-maximize" title="Maximize">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
        </button>
        <button class="window-btn close-btn" id="btn-close" title="Close (Minimizes to Tray)">
          <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
        </button>
      </div>
    </header>

    <!-- 2. Main Content Container (Spider Connection Board) -->
    <main class="main-container spider-board" id="spider-board">
      <!-- SVG Canvas for Spider Connection Cables -->
      <svg id="spider-canvas" class="spider-canvas"></svg>

      <!-- Left Column: Output Devices -->
      <section class="section col-devices" id="section-devices">
        <div class="section-title">
          <span>Output Endpoints</span>
          <span class="badge" id="devices-count">3 active</span>
        </div>
        <div class="device-column-list" id="devices-grid">
          <!-- Populated by app.js -->
        </div>
      </section>

      <!-- Right Column: Running Applications -->
      <section class="section col-apps" id="section-apps">
        <div class="section-title">
          <span>Audio Sources</span>
          <span class="badge" id="apps-count">4 sessions</span>
        </div>
        <div class="apps-column-list" id="apps-list">
          <!-- Populated by app.js -->
        </div>
      </section>
    </main>

    <!-- 3. Profile Footer (Pinned) -->
    <footer class="profile-footer" id="profile-footer">
      <div class="section-title" style="margin-bottom: 4px;">
        <span>Profiles</span>
      </div>
      <div class="profile-pills-row" id="profiles-row">
        <!-- Populated by app.js -->
      </div>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Create Profile Modal -->
    <div class="modal-overlay" id="modal-new-profile">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title">Save Audio Profile</span>
          <button class="modal-close-btn" id="modal-close">✕</button>
        </div>
        <div class="modal-input-group">
          <label class="modal-label" for="profile-name-input">Profile Name</label>
          <input type="text" id="profile-name-input" class="modal-input" placeholder="e.g. Late Night Beats" maxlength="24">
          <div class="modal-chips-row" id="name-chips">
            <span class="modal-chip" data-name="Gaming Mode">🎮 Gaming</span>
            <span class="modal-chip" data-name="Deep Focus">🎵 Focus</span>
            <span class="modal-chip" data-name="Zoom & Meet">💼 Meeting</span>
            <span class="modal-chip" data-name="Night Session">🌙 Night</span>
          </div>
        </div>
        <div class="modal-input-group">
          <label class="modal-label" for="profile-icon-input">Icon Emoji</label>
          <div class="icon-input-row">
            <input type="text" id="profile-icon-input" class="modal-input icon-input" placeholder="🎧" maxlength="2" value="🎧">
            <div class="modal-emoji-picker">
              <span class="emoji-opt">🎮</span>
              <span class="emoji-opt">🎵</span>
              <span class="emoji-opt">💼</span>
              <span class="emoji-opt">🎬</span>
              <span class="emoji-opt">🎧</span>
              <span class="emoji-opt">🎙️</span>
              <span class="emoji-opt">🔊</span>
              <span class="emoji-opt">⚡</span>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
          <button class="btn btn-primary" id="modal-save">Save Profile</button>
        </div>
      </div>
    </div>

    <!-- System Settings Modal -->
    <div class="modal-overlay" id="modal-settings">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title">Noir System Settings</span>
          <button class="modal-close-btn" id="modal-settings-close">✕</button>
        </div>
        <div class="settings-list">
          <label class="settings-item">
            <div class="settings-text">
              <span class="settings-title">Start with Windows</span>
              <span class="settings-desc">Launch Noir minimized to system tray on login</span>
            </div>
            <input type="checkbox" id="setting-autostart" class="settings-toggle">
          </label>

          <label class="settings-item">
            <div class="settings-text">
              <span class="settings-title">Close to System Tray</span>
              <span class="settings-desc">Keep audio routing running in background when closed</span>
            </div>
            <input type="checkbox" id="setting-closetotray" class="settings-toggle" checked disabled>
          </label>

          <label class="settings-item">
            <div class="settings-text">
              <span class="settings-title">Auto-Apply Profile on Launch</span>
              <span class="settings-desc">Restore your active preset automatically on startup</span>
            </div>
            <input type="checkbox" id="setting-autoapply" class="settings-toggle" checked disabled>
          </label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="modal-settings-done">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/notifications.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
