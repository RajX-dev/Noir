<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir — Audio Router</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div id="app">
    <!-- 1. Title Bar -->
    <header class="titlebar" id="titlebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <span class="brand-name">Noir</span>
        <span class="brand-subtitle">Patchbay</span>
      </div>
      
      <div class="titlebar-actions">
        <button class="window-btn" id="btn-minimize" title="Minimize">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="window-btn" id="btn-maximize" title="Maximize">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
        </button>
        <button class="window-btn close-btn" id="btn-close" title="Close">
          <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
        </button>
      </div>
    </header>

    <!-- 2. Main Content Container (Spider Connection Board) -->
    <main class="main-container spider-board" id="spider-board">
      <!-- SVG Canvas for Spider Connection Cables -->
      <svg id="spider-canvas" class="spider-canvas"></svg>

      <!-- Left Column: Output Devices -->
      <section class="section col-devices" id="section-devices">
        <div class="section-title">
          <span>Output Endpoints</span>
          <span class="badge" id="devices-count">3 active</span>
        </div>
        <div class="device-column-list" id="devices-grid">
          <!-- Populated by app.js -->
        </div>
      </section>

      <!-- Right Column: Running Applications -->
      <section class="section col-apps" id="section-apps">
        <div class="section-title">
          <span>Audio Sources</span>
          <span class="badge" id="apps-count">4 sessions</span>
        </div>
        <div class="apps-column-list" id="apps-list">
          <!-- Populated by app.js -->
        </div>
      </section>
    </main>

    <!-- 3. Profile Footer (Pinned) -->
    <footer class="profile-footer" id="profile-footer">
      <div class="section-title" style="margin-bottom: 4px;">
        <span>Profiles</span>
      </div>
      <div class="profile-pills-row" id="profiles-row">
        <!-- Populated by app.js -->
      </div>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Create Profile Modal -->
    <div class="modal-overlay" id="modal-new-profile">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title">Save Audio Profile</span>
          <button class="modal-close-btn" id="modal-close">✕</button>
        </div>
        <div class="modal-input-group">
          <label class="modal-label" for="profile-name-input">Profile Name</label>
          <input type="text" id="profile-name-input" class="modal-input" placeholder="e.g. Late Night Beats" maxlength="24">
          <div class="modal-chips-row" id="name-chips">
            <span class="modal-chip" data-name="Gaming Mode">🎮 Gaming</span>
            <span class="modal-chip" data-name="Deep Focus">🎵 Focus</span>
            <span class="modal-chip" data-name="Zoom & Meet">💼 Meeting</span>
            <span class="modal-chip" data-name="Night Session">🌙 Night</span>
          </div>
        </div>
        <div class="modal-input-group">
          <label class="modal-label" for="profile-icon-input">Icon Emoji</label>
          <div class="icon-input-row">
            <input type="text" id="profile-icon-input" class="modal-input icon-input" placeholder="🎧" maxlength="2" value="🎧">
            <div class="modal-emoji-picker">
              <span class="emoji-opt">🎮</span>
              <span class="emoji-opt">🎵</span>
              <span class="emoji-opt">💼</span>
              <span class="emoji-opt">🎬</span>
              <span class="emoji-opt">🎧</span>
              <span class="emoji-opt">🎙️</span>
              <span class="emoji-opt">🔊</span>
              <span class="emoji-opt">⚡</span>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
          <button class="btn btn-primary" id="modal-save">Save Profile</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/notifications.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
